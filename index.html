<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mut:#6b7585;--ln:#e1e6ee;--pri:#1f4fd8;--ok:#1e9e5a;--okbg:#e3f6ec;--missbg:#fdeeee;
--e:#9aa5b5;--q:#e8742b;--l:#2b7be8;--t:#d9a400;--s:#4aa86a;--x:#d6336c;--r:#c4cad5;
box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#18202f;--tx:#e8edf6;--mut:#93a0b5;--ln:#28324a;--pri:#6b93ff;--ok:#4cd08a;--okbg:#14382a;--missbg:#34202a}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#18202f;--tx:#e8edf6;--mut:#93a0b5;--ln:#28324a;--pri:#6b93ff;--ok:#4cd08a;--okbg:#14382a;--missbg:#34202a}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"SF Pro Text",Arial,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh}
main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;width:100%;max-width:640px;margin:0 auto;padding:6px 14px 14px;touch-action:pan-y}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:16px;margin:18px 0 8px}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
.card.hero{border-color:color-mix(in srgb,var(--pri) 42%,var(--ln));background:color-mix(in srgb,var(--pri) 23%,var(--bg))}
.bday{display:flex;align-items:center;gap:10px;border-color:color-mix(in srgb,var(--pri) 40%,var(--ln));background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 16%,var(--card)),var(--card))}.bday .cake{font-size:28px;line-height:1}
.big{font-size:34px;font-weight:700;color:var(--pri);line-height:1.1}
.bar{height:8px;background:var(--ln);border-radius:5px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok);width:0}
.d{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--r);border-radius:10px;padding:9px 10px;margin:7px 0}
.d.t-e{border-left-color:var(--e)}.d.t-a{border-left-color:var(--e)}.d.t-q{border-left-color:var(--q)}.d.t-l{border-left-color:var(--l)}.d.t-t{border-left-color:var(--t)}.d.t-s{border-left-color:var(--s)}.d.t-x{border-left-color:var(--x)}
.d.done{background:var(--okbg)}
.dh{display:flex;justify-content:space-between;gap:8px}.tp{font-size:12px;color:var(--mut)}
.ds{margin:3px 0;font-size:14px}
.df{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.df input{width:84px;padding:6px 8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.gift-actions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:8px}.gift-actions input{width:100%;min-width:0}.gift-actions #goalunlock{grid-column:1/-1}
.ck{margin-left:0;min-width:44px;height:36px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--mut);font-size:18px}
.d.done .ck{background:var(--ok);color:#fff;border-color:var(--ok)}
details{background:var(--card);border:1px solid var(--ln);border-radius:14px;margin:10px 0;padding:0 10px}
summary{padding:12px 2px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
/* Disable browser scroll anchoring while a previous exercise collapses. */
.supplement-exercise-group,.supplement-exercise{overflow-anchor:none}
summary::-webkit-details-marker{display:none}summary small{color:var(--mut);font-weight:400}
.ih{background:transparent;border:0;border-radius:8px;margin:2px 0;padding:0}.ih summary{padding:5px 0;color:var(--pri);font-size:13px;font-weight:600;justify-content:flex-start;align-items:center}.ih .ii{display:inline-flex;width:19px;height:19px;align-items:center;justify-content:center;border:1px solid currentColor;border-radius:50%;font-family:serif;font-size:13px;font-style:italic;line-height:1}.ih .ic{padding:2px 0 6px 25px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
.zone-name{font-size:10px;color:var(--mut);font-weight:400;white-space:nowrap}
html[data-zoom="100"] .pace-zone-table{table-layout:fixed;font-size:12px}
html[data-zoom="100"] .pace-zone-table th,html[data-zoom="100"] .pace-zone-table td{padding:6px 2px}
html[data-zoom="100"] .pace-zone-table th:nth-child(-n+3),html[data-zoom="100"] .pace-zone-table td:nth-child(-n+3){white-space:nowrap}
html[data-zoom="100"] .pace-zone-table th:first-child,html[data-zoom="100"] .pace-zone-table td:first-child{width:22%}
html[data-zoom="100"] .pace-zone-table th:nth-child(2),html[data-zoom="100"] .pace-zone-table td:nth-child(2){width:24%}
html[data-zoom="100"] .pace-zone-table th:nth-child(3),html[data-zoom="100"] .pace-zone-table td:nth-child(3){width:23%}
html[data-zoom="100"] .pace-zone-table th:last-child,html[data-zoom="100"] .pace-zone-table td:last-child{width:31%}
nav{flex:0 0 auto;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);transition:transform 1.2s cubic-bezier(.2,.7,.25,1),opacity 1.2s ease-in-out;will-change:transform,opacity}
nav.nav-hiding{transform:translateY(105%);opacity:0;pointer-events:none}nav[hidden]{display:none!important}
.welcome-popup{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:24px;background:rgba(10,14,24,.3);opacity:0;transition:opacity .4s ease;pointer-events:none}.welcome-popup.show{opacity:1}.welcome-popup.out{opacity:0}.welcome-card{width:min(100%,420px);padding:24px 22px;border:1px solid color-mix(in srgb,var(--pri) 34%,var(--ln));border-radius:22px;background:linear-gradient(145deg,color-mix(in srgb,var(--pri) 13%,var(--card)),var(--card) 72%);box-shadow:0 18px 54px #0004;text-align:center;transform:translateY(8px) scale(.98);transition:transform .48s cubic-bezier(.22,.72,.25,1)}.welcome-popup.show .welcome-card{transform:translateY(0) scale(1)}.welcome-icon{font-size:34px;line-height:1.1;margin-bottom:9px}.welcome-title{font-size:22px;font-weight:800;line-height:1.28;color:var(--pri)}.welcome-message{margin-top:9px;font-size:15px;line-height:1.55;color:var(--tx)} .welcome-popup[hidden]{display:none!important}
.welcome-popup.birthday-celebration{background:radial-gradient(ellipse at 50% 48%,rgba(255,190,61,.34),rgba(28,12,30,.74) 68%)}
.birthday-celebration .welcome-card{position:relative;z-index:2;border-color:#ffd66e;background:linear-gradient(145deg,#fff1bd 0%,color-mix(in srgb,#ff83aa 17%,var(--card)) 40%,var(--card) 78%);box-shadow:0 0 0 1px #fff8,0 0 38px #ffca578c,0 22px 64px #0009}
.birthday-celebration .welcome-icon{font-size:56px;filter:drop-shadow(0 5px 7px #ffac3888);animation:bdayCakePop .82s cubic-bezier(.18,.9,.24,1.4) both}
.birthday-celebration .welcome-title{color:#e58a16;text-shadow:0 1px #fff9,0 0 16px #ffd66e99}
.welcome-popup.birthday-celebration{pointer-events:auto;overflow:hidden;isolation:isolate;cursor:pointer}
.birthday-celebration .welcome-card:before{content:"";position:absolute;z-index:-1;inset:-22px;border-radius:34px;background:conic-gradient(from 0deg,#ffd24a66,#ff5f7e55,#7c91ff66,#4bd8c066,#ffd24a66);filter:blur(22px);opacity:.75;animation:bdayAura 5s ease-in-out infinite alternate}
.birthday-fireworks,.birthday-stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.birthday-fireworks{z-index:1}
.birthday-fireworks i{position:absolute;left:var(--x);top:var(--y);width:8px;height:8px;border-radius:50%;background:var(--color);box-shadow:0 0 8px 3px var(--color),0 -17px 0 -2px var(--color),12px -12px 0 -2px var(--color),17px 0 0 -2px var(--color),12px 12px 0 -2px var(--color),0 17px 0 -2px var(--color),-12px 12px 0 -2px var(--color),-17px 0 0 -2px var(--color),-12px -12px 0 -2px var(--color);opacity:0;animation:bdayFirework 1.8s ease-out var(--delay) infinite}
.birthday-stars{z-index:4}
.birthday-stars i{position:absolute;left:var(--x);top:var(--y);color:var(--color);font-style:normal;font-size:var(--size);line-height:1;text-shadow:0 0 10px currentColor;animation:bdayTwinkle 1.8s ease-in-out var(--delay) infinite alternate}
.welcome-confetti{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none}
.welcome-confetti i{position:absolute;left:50%;top:48%;width:8px;height:13px;border-radius:2px;background:var(--color);opacity:0;box-shadow:0 1px 4px #0003;animation:bdayConfetti var(--duration) cubic-bezier(.13,.66,.32,1) var(--delay) forwards}

var helper='<h2>Giải thích vùng chạy</h2><div class="card pace-explain-group"><details><summary><b>E · Easy (chạy nhẹ)</b></summary><p>Chạy dễ chịu, nói chuyện được thành câu; ưu tiên thư giãn và tích lũy nền aerobic. Dùng cho chạy hồi phục, buổi nhẹ và phần lớn long run. Không cần ép theo pace nếu nóng, dốc hoặc mệt.</p></details><details><summary><b>T · Tempo (chạy ngưỡng)</b></summary><p>Nỗ lực vừa khó: thở mạnh nhưng vẫn kiểm soát, chỉ nói được cụm từ ngắn. Chạy liên tục hoặc chia đoạn theo giáo án để cải thiện khả năng duy trì tốc độ. Khởi động kỹ và không biến mọi buổi thành chạy đua.</p></details><details><summary><b>I · Interval (chạy biến tốc)</b></summary><p>Các đoạn nhanh lặp lại xen kẽ chạy/chậm hoặc nghỉ hồi phục. Chạy nhanh có kiểm soát, giữ kỹ thuật và chất lượng tương đối đồng đều giữa các lượt; không nước rút hết sức nếu giáo án không yêu cầu.</p></details><details><summary><b>R · Repetition (lặp ngắn nhanh)</b></summary><p>Các đoạn ngắn nhanh để luyện tốc độ và dáng chạy, nghỉ đủ để hồi phục. Chạy thả lỏng, bước nhanh gọn, không gồng vai.</p></details><details><summary><b>Strides · tăng tốc thả lỏng</b></summary><p>Tăng tốc dần khoảng 15–20 giây, không chạy hết sức; đi bộ hoặc jog nhẹ 40–60 giây giữa các lượt. Tập trung tư thế và nhịp chân.</p></details><details><summary><b>KĐ / HN / LR / XT</b></summary><p>KĐ: khởi động; HN: hạ nhiệt; LR: long run (chạy dài); XT: cross-training (tập bổ trợ thay thế chạy). Làm theo thời lượng và km trong giáo án.</p></details></div><h2>Bài bổ trợ</h2><details class="ih"><summary><span class="ii">i</span> Thông tin bài bổ trợ</summary><div class="sub ic">Các bài bổ trợ cần thiết trong chạy bộ, có kèm ảnh minh họa</div></details><div class="card supplement-exercise-group">'+ex.map(function(x,i){return '<details class="supp-exercise"><summary><b>'+(i+1)+'. '+x[1]+'</b></summary><img src="assets/support-'+x[0]+'.jpg" alt="Minh họa '+x[1]+'" loading="lazy" style="display:block;width:100%;max-width:520px;margin:10px auto function planMedalResult(p){var race=pd(p.race),target=dk(p).k,best=null;ST.rs.forEach(function(r){var legacy=!r.kind&&r.name===p.name;if(r.plan!==p.id||!(r.kind==="race"||legacy)||!r.time||Math.abs(r.dist-target)>.1)return;var delta=Math.abs(pd(r.date)-race);if(delta>3*DAY)return;if(!best||delta<best.delta)best={r:r,delta:delta}});return best&&best.r}

NOTES=["Bản 1.2.132: Giữ nguyên lịch các tuần đã qua và tuần hiện tại; thay đổi bắt đầu tuần kế tiếp, khối lượng tự động tham chiếu các tuần hoàn thành gần nhất.","Bản 1.2.131: Kiểm tra kỹ lịch và dữ liệu trước khi khôi phục; bản không hợp lệ sẽ được từ chối để giữ nguyên dữ liệu hiện có.","Bản 1.2.130: Cập nhật phiên bản chỉ dùng tệp mới từ mạng, không nạp nhầm bản lưu cũ khi kết nối lỗi; dữ liệu khôi phục không hợp lệ sẽ không thay thế dữ liệu hiện tại.","Bản 1.2.129: Hướng dẫn sử dụng được đồng bộ với giao diện hiện tại; lịch sử phiên bản viết ngắn gọn, dễ hiểu.","Bản 1.2.49: thêm thống kê số hoạt động và km thực tế theo tháng/lũy kế năm trên Trang chủ; tiêu đề biểu đồ tuần kèm tên kế hoạch; rút gọn lời chúc ở Dấu ấn cá nhân.","Bản 1.2.48: tôn vinh mục Dấu ấn cá nhân bằng bục top 3, xếp hạng medal theo thành tích và gọi chi tiết là Certificate.","Bản 1.2.47: chạm medal đang mở lần nữa để ẩn thông tin; chạm medal khác để chuyển nội dung.","Bản 1.2.46: thu gọn hướng dẫn mở khóa giao diện và sao lưu; thêm medal theo kế hoạch, mở sáng khi lưu kết quả cuộc đua tương ứng.","Bản 1.2.45: mô tả tóm tắt của mục thông tin xuống dòng dưới tiêu đề; thu gọn Cơ sở của giáo án và đặt cuối tab Pace.","Bản 1.2.44: lịch sử cập nhật hiển thị tối đa 5 bản gần nhất; dùng Show more để xem các bản cũ hơn.","Bản 1.2.43: thu nhỏ nút làm mới thời tiết và đặt ở góc phải banner; thêm mô tả ngắn cạnh biểu tượng thông tin trong các mục thu gọn.","Bản 1.2.42: thu gọn mục vị trí thời tiết và nhắc tập; thêm nút làm mới thời tiết theo vị trí; hiển thị lịch sử cập nhật mới nhất.","Bản 1.2.41: chuyển hướng dẫn khối lượng và thời lượng giáo án tới vị trí phù hợp, số tuần thay đổi theo lịch.","Bản 1.2.40: thu gọn các hướng dẫn dài trong mục Giải sau biểu tượng thông tin.","Bản 1.2.39: chọn riêng ngày chạy chính và chạy phụ.","Bản 1.2.38: chọn loại buổi riêng cho cả 7 ngày.","Bản 1.2.37: tùy chỉnh ngày chạy, bổ trợ và nghỉ theo tuần.","Thêm hai giao diện giới hạn Iron Man và Avengers với ảnh nền, màu sắc và icon riêng.","Thêm hai giao diện giới hạn Bumblebee và Sword Art Online với bảng màu, chữ và icon điều hướng riêng.","Optimus Prime: bỏ viền vàng mặc định quanh nút thu phóng; viền vàng chỉ hiện khi tương tác hoặc mở bảng chọn.","Tăng phong cách kim loại cơ khí cho đồng hồ, nhiệt độ và tên vận động viên trong giao diện Optimus Prime."],
GUIDE=[
["Cài app lên iPhone","Mở trang của app bằng <b>Safari</b> → nút Chia sẻ → <b>Thêm vào Màn hình chính</b> → mở app từ biểu tượng vừa tạo. Sau lần đầu app chạy được cả khi mất mạng (riêng thời tiết và kiểm tra cập nhật cần internet). Thông báo đẩy cần iOS 16.4 trở lên."],
["Trang chủ","Tiêu đề trên cùng là lời chào theo giờ kèm tên của anh (đặt ở ⚙️ Cài đặt → Hồ sơ). Popup lời chào hiện ngẫu nhiên tối đa hai lần trong mỗi khung giờ sáng (04:00–11:59), chiều (12:00–17:59), tối (18:00–03:59); đủ sáu lượt trong ngày sẽ không lặp lời chào hoặc thông điệp. Ngày sinh nhật và ngày đua thay bằng lời nhắn riêng, tối đa hai lần mở đầu tiên trong cả ngày. Popup sinh nhật có pháo giấy khi mở, pháo hoa, sao và quầng sáng quanh popup; chạm màn hình để đóng ngay hoặc để popup tự đóng sau 20 giây. Thẻ giải chạy ghi tên giải, ngày thi đấu, cự ly, mục tiêu và số ngày còn lại. Đúng ngày thi, Trang chủ tự căn thẻ nhắc nhở vào giữa màn hình; thẻ có lời chúc, chiến thuật và nhận xét thời tiết theo nhiệt độ/cảm giác nóng, độ ẩm, gió/giật, mưa, UV. Nếu chưa sao lưu hoặc đã hơn 7 ngày, thẻ nhắc sao lưu xuất hiện tại đây; bấm để mở Cài đặt. Bên dưới là buổi tập hôm nay, ngày mai, gợi ý pace và nhịp tim, dải 7 ngày của tuần (bấm một ngày để nhảy sang Lịch), biểu đồ km theo tuần và thống kê hoạt động theo tháng/năm. Thanh điều hướng là bong bóng nổi có viền, cố định ở đáy theo vùng an toàn của từng máy trong khi nội dung cuộn; tự ẩn sau 5 giây không thao tác, vuốt xuống để hiện và vuốt lên để ẩn. Nhãn tab Home, Lịch, Giải, Pace, Race Day và Guide; vuốt trái/phải trên nội dung để chuyển tab theo vòng tròn."],
["Lịch: tick buổi tập, nhập km, ghi chú","Mở tuần muốn xem để mở các ngày. Với buổi tập có kế hoạch, nhập <b>km thực tế</b> bằng hai ô số hoặc bấm <b>✔</b> để đánh dấu hoàn thành từ ngày tập trở đi. Các ngày tương lai bị khóa và ghi rõ “Buổi sắp tới”; ghi chú chỉ được sửa từ ngày tập trở đi. Bấm <b>📝</b> để ghi mức nặng (RPE), giày và cảm giác. Mục <b>Chi tiết &amp; lưu ý</b> hướng dẫn cách tập từng buổi; mỗi lần chỉ mở một mục chi tiết. Ngày đã qua mà chưa tick sẽ hiện màu “bỏ lỡ”."],
["Giải: tạo và sửa kế hoạch","Ở tab Giải, nhập tên giải, ngày bắt đầu để chọn thời lượng, <b>ngày thi đấu</b>, cự ly, mục tiêu A và dự phòng B, khối lượng tập. Chế độ Tự động tham chiếu tối đa 2 tuần hoàn thành gần nhất và giới hạn tăng khối lượng tuần cao điểm khoảng 10%; chọn mức khác để tự đặt khối lượng. Tuần giáo án bắt đầu từ Thứ 2; chọn loại buổi riêng cho từng ngày trong tuần và đánh dấu đúng 4 ngày chạy chính. Ngày chạy phụ, bổ trợ hoặc nghỉ vẫn có thể ghi km; km đó chỉ cộng vào thống kê thực tế. <b>Lưu kế hoạch này</b> để sửa kế hoạch đang dùng. Các tuần đã qua và tuần hiện tại được giữ nguyên; thay đổi áp dụng từ tuần kế tiếp. <b>Tạo kế hoạch mới</b> để thêm giải khác."],
["Kết quả giải và Certificate","Trong tab Giải, phần Kết quả thi đấu có lựa chọn <b>Giải mục tiêu của kế hoạch</b> hoặc <b>Bài test / giải khác</b>. Chọn loại giải mục tiêu, gắn với kế hoạch và nhập đúng cự ly để app ghi nhận buổi thi đấu; kết quả phù hợp ngày thi sẽ mở Certificate ở tab Race Day → Dấu ấn cá nhân. Bài test 5K và giải khác không mở medal."],
["Dấu ấn cá nhân","Trong tab Race Day, kéo xuống mục <b>Dấu ấn cá nhân</b>. Medal mờ là kế hoạch chưa có kết quả giải mục tiêu. Chạm medal đã sáng để xem Certificate được trình bày nổi bật với vận động viên, tên giải, cự ly, thời gian, pace và ngày chạy; chạm medal lần nữa để đóng. Bục top 3 được làm nổi bật, các kết quả tiếp theo xếp theo thành tích."],
["Pace và Ngày thi đấu","Tab <b>Pace</b> cho vùng pace E (Easy), T (Tempo), I (Interval) và pace thi đấu (cùng nhịp tim nếu đã nhập ngày sinh), cùng công cụ chốt mục tiêu sau test 5K. Mục <b>Bài bổ trợ</b> có nút <b>i</b> với mô tả “Các bài bổ trợ cần thiết trong chạy bộ, có kèm ảnh minh họa”; chạm tên bài để xem hướng dẫn và ảnh, mỗi lần chỉ mở một bài. Các mục giải thích E/T/I cũng mở lần lượt, mục mới sẽ đóng mục trước. Tab <b>Race Day</b> có mốc pace A/B, chiến thuật theo cự ly, bữa ăn và gel/nước; bổ sung checklist tối hôm trước, trước giờ xuất phát, khởi động, plan B khi pace lệch và lưu ý an toàn. Từ nhắc nhở ngày thi trên Trang chủ, bấm <b>Mở Race Day</b> để tới tab này."],
["Cài đặt ⚙️","Gồm: Hồ sơ người tập (tên, ngày sinh, chiều cao, cân nặng, nhịp tim tối đa), Giao diện (nền và màu nhấn; các theme Optimus Prime, Bumblebee, Sword Art Online, Iron Man, Avengers, Naruto · Làng Lá, Chelsea FC, Chú thuật hồi chiến và My Race là giao diện giới hạn, mở bằng Gift code hoặc mục tiêu tập 2 tuần; My Race là giao diện mặc định đại diện bộ nhận diện app, phối xanh navy, xanh lá, cyan và cam theo logo/icon), <b>Xuất lịch .ics</b> để đưa các buổi tập vào Lịch của iPhone, <b>Nhắc tập bằng thông báo đẩy</b> (cần Cloudflare Worker, xem HANDOFF.md) và <b>Sao lưu dữ liệu</b>. Sửa hồ sơ xong nhớ bấm Lưu và thoát."],
["Thu phóng cỡ chữ","Bấm nút phần trăm ở góc phải tiêu đề, chọn một trong các mức 50, 75, 85, 100, 125, 175, 200%. Cũng có thể chụm hai ngón tay trên nội dung, app tự nhảy tới mức gần nhất. Mức đã chọn được nhớ cho lần sau."],
["Sao lưu và đổi máy","Vào ⚙️ Cài đặt → Sao lưu dữ liệu, chọn <b>Tạo và chia sẻ file</b> hoặc <b>Tải file</b>. Trang chủ nhắc khi chưa từng sao lưu hoặc bản gần nhất đã hơn 7 ngày. Bản sao lưu gồm hồ sơ, kế hoạch, lịch tập, kết quả, giao diện và thiết lập xuất lịch; không gồm vị trí thời tiết, quyền mở khóa hoặc cấu hình thông báo đẩy. Trên máy mới, chọn <b>Khôi phục từ file</b>. Khi khôi phục, app kiểm tra cấu trúc trước; nếu file không hợp lệ, dữ liệu hiện tại được giữ nguyên."],
["Cập nhật phiên bản","Khi mở app có internet, app tự kiểm tra bản mới. Nếu có, biểu tượng ℹ️ hiện chấm đỏ và có thanh thông báo. Vào mục này, bấm <b>Cập nhật ngay</b>. App xác nhận các tệp phiên bản mới đã sẵn sàng rồi mới tải lại; nếu mạng lỗi hoặc các tệp chưa đồng bộ, app báo để thử lại và giữ nguyên dữ liệu tập luyện."],
["Nhắc tập và thời tiết","Vào ⚙️ Cài đặt → mở <b>Vị trí thời tiết</b> để cho phép GPS hoặc nhập tọa độ. App ưu tiên vị trí GPS hiện tại, dùng tọa độ đã lưu nếu GPS không khả dụng. Dưới thông tin thời tiết có giờ cập nhật nhỏ, mờ; nếu xem dữ liệu lưu khi mất mạng, dòng này cũng ghi trạng thái ngoại tuyến. Mở <b>Nhắc tập bằng thông báo đẩy</b>, nhập địa chỉ Worker và mã công khai nếu được cung cấp, chọn giờ nhắc sáng/chiều rồi bật nhắc. Nếu gửi gặp lỗi tạm thời, Worker tự thử lại trong cửa sổ 30 phút."],
["Khôi phục khi dữ liệu bị lỗi","App giữ một bản dữ liệu hợp lệ gần nhất trên thiết bị. Nếu dữ liệu chính hỏng, app mở bằng bản dự phòng; nếu không có bản dự phòng, app vẫn mở kế hoạch mặc định trong Chế độ an toàn và giữ nguyên dữ liệu lỗi để có thể tải xuống. Vào Cài đặt → Sao lưu dữ liệu để khôi phục file hợp lệ."],
["Lưu ý an toàn","Giáo án, pace và nhịp tim chỉ là ước tính để tham khảo. Đau nhói kéo dài, chóng mặt, tức ngực hay có bệnh nền thì nên dừng tập và hỏi ý kiến bác sĩ hoặc huấn luyện viên."]];
